<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师节快乐 · 桃李满天下</title>
<style>
  :root {
    --bg-grad-start: #2c1a3e;
    --bg-grad-end: #0f0a1f;
    --primary: #e8b86a;
    --accent: #ff6b9d;
    --ink: #fef6e4;
    --soft: rgba(255, 246, 228, 0.72);
    --card-bg: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.14);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Songti SC", "STSong", "Noto Serif SC", "Microsoft YaHei", serif;
    background: radial-gradient(ellipse at top, var(--bg-grad-start), var(--bg-grad-end));
    color: var(--ink);
    position: relative;
    overflow-x: hidden;
  }
  canvas#petals, canvas#fireworks {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #petals { z-index: 2; }
  #fireworks { z-index: 1; }

  .scene {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2rem clamp(1rem, 4vw, 4rem);
    text-align: center;
  }

  .title-wrap { margin-bottom: clamp(2rem, 5vh, 3rem); }
  .label {
    font-size: clamp(0.85rem, 2vw, 1rem);
    letter-spacing: 0.4em;
    color: var(--primary);
    margin-bottom: 1rem;
    opacity: 0.85;
  }
  .title {
    font-size: clamp(2.6rem, 9vw, 5.5rem);
    font-weight: 700;
    line-height: 1.1;
    background: linear-gradient(135deg, #ffe4a0 0%, var(--primary) 45%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 24px rgba(232, 184, 106, 0.3);
    animation: titleFade 1.8s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }
  .subtitle {
    font-size: clamp(0.95rem, 2.2vw, 1.3rem);
    color: var(--soft);
    margin-top: 0.8rem;
    letter-spacing: 0.08em;
    animation: fadeUp 2s 0.5s both;
  }
  @keyframes titleFade {
    from { opacity: 0; transform: translateY(-24px) scale(0.95); }
    to { opacity: 1; transform: none; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: none; }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: clamp(1.4rem, 4vw, 2.2rem) clamp(1.8rem, 5vw, 3rem);
    max-width: 640px;
    width: 100%;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    animation: fadeUp 1.6s 0.9s both;
  }
  .card-title {
    font-size: clamp(1rem, 2.4vw, 1.25rem);
    color: var(--primary);
    letter-spacing: 0.25em;
    margin-bottom: 1rem;
  }
  .quote {
    font-size: clamp(1.05rem, 2.6vw, 1.5rem);
    line-height: 1.85;
    color: var(--ink);
    font-weight: 300;
    min-height: 6em;
    transition: opacity 0.5s ease;
  }
  .quote::before, .quote::after {
    content: "「";
    color: var(--accent);
    font-size: 1.3em;
    margin-right: 0.2em;
  }
  .quote::after {
    content: "」";
    margin-left: 0.2em;
    margin-right: 0;
  }
  .author {
    margin-top: 1rem;
    font-size: clamp(0.8rem, 2vw, 1rem);
    color: var(--soft);
    text-align: right;
  }
  .dots {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    margin-top: 1.4rem;
    flex-wrap: wrap;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .dot.active {
    background: var(--primary);
    width: 20px;
    border-radius: 4px;
  }

  .actions {
    display: flex;
    gap: 1rem;
    margin-top: clamp(1.5rem, 4vh, 2.5rem);
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 2s 1.3s both;
  }
  button {
    font-family: inherit;
    font-size: clamp(0.9rem, 2.2vw, 1.05rem);
    letter-spacing: 0.1em;
    padding: 0.75rem 1.8rem;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.25s ease;
    color: var(--bg-grad-start);
    background: linear-gradient(135deg, var(--primary), var(--accent));
    box-shadow: 0 6px 20px rgba(232, 184, 106, 0.4);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(232, 184, 106, 0.55); }
  button.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  button.ghost:hover { border-color: var(--primary); color: var(--primary); }

  .panel {
    max-width: 640px;
    width: 100%;
    margin-top: 1.2rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem 1.6rem;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: none;
    animation: fadeUp 0.4s both;
  }
  .panel.show { display: block; }
  .panel h3 {
    font-size: clamp(0.95rem, 2.2vw, 1.1rem);
    color: var(--primary);
    letter-spacing: 0.15em;
    margin-bottom: 0.9rem;
    font-weight: 500;
  }
  .field { margin-bottom: 0.8rem; text-align: left; }
  .field label {
    display: block;
    font-size: 0.82rem;
    color: var(--soft);
    margin-bottom: 0.4rem;
    letter-spacing: 0.08em;
  }
  .field input, .field textarea {
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.65rem 0.85rem;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.25s ease;
    resize: vertical;
  }
  .field input:focus, .field textarea:focus { border-color: var(--primary); }
  .field textarea { min-height: 80px; line-height: 1.6; }
  .panel-actions { display: flex; gap: 0.6rem; margin-top: 0.6rem; flex-wrap: wrap; }
  .panel-actions button { padding: 0.55rem 1.1rem; font-size: 0.88rem; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    z-index: 99;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .modal.show { display: flex; animation: fadeUp 0.3s both; }
  .modal-inner {
    position: relative;
    max-width: 540px;
    width: 100%;
    max-height: 92vh;
    overflow: auto;
  }
  .modal-inner canvas {
    width: 100%;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: block;
  }
  .modal-actions {
    display: flex;
    gap: 0.7rem;
    justify-content: center;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .close-x {
    position: absolute;
    top: -0.5rem;
    right: -0.5rem;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--primary);
    color: var(--bg-grad-start);
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
  .pattern-picker {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .pattern-chip {
    width: 44px; height: 44px;
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .pattern-chip::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 60%);
  }
  .pattern-chip.active {
    border-color: #fff;
    transform: scale(1.1);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .pattern-chip:hover { transform: scale(1.08); }

  .dynamic-stage {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: radial-gradient(ellipse at top, #1a0d2e, #06030f);
    text-align: center;
  }
  .dynamic-stage.show { display: flex; animation: fadeIn 0.6s both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .dynamic-stage .dc-label {
    font-size: clamp(0.8rem, 2vw, 1rem);
    color: var(--primary);
    letter-spacing: 0.5em;
    opacity: 0;
    animation: fadeUp 1s 0.3s forwards;
  }
  .dynamic-stage .dc-title {
    font-size: clamp(3rem, 11vw, 7rem);
    font-weight: 700;
    line-height: 1.1;
    margin-top: 1.5rem;
    background: linear-gradient(135deg, #ffe4a0 0%, var(--primary) 50%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 24px rgba(232,184,106,0.4));
    opacity: 0;
    transform: translateY(20px);
    animation: dcTitle 1.2s 0.6s forwards;
  }
  @keyframes dcTitle { to { opacity: 1; transform: none; } }
  .dynamic-stage .dc-subtitle {
    font-size: clamp(0.95rem, 2.4vw, 1.3rem);
    color: var(--soft);
    margin-top: 0.8rem;
    letter-spacing: 0.15em;
    opacity: 0;
    animation: fadeUp 1.5s 1.4s forwards;
  }
  .dynamic-stage .dc-divider {
    width: 60px;
    height: 1px;
    background: var(--primary);
    margin: 2.5rem 0;
    opacity: 0;
    transform: scaleX(0);
    animation: dcLine 0.8s 1.8s forwards;
  }
  @keyframes dcLine { to { opacity: 1; transform: scaleX(1); } }
  .dynamic-stage .dc-quote {
    max-width: 640px;
    font-size: clamp(1.15rem, 3vw, 1.7rem);
    line-height: 2;
    color: var(--ink);
    font-weight: 300;
    opacity: 0;
    transform: translateY(10px);
  }
  .dynamic-stage .dc-author {
    margin-top: 1.5rem;
    font-size: clamp(0.9rem, 2.2vw, 1.1rem);
    color: var(--primary);
    letter-spacing: 0.2em;
    opacity: 0;
    animation: fadeUp 1s 4s forwards;
  }
  .dynamic-stage .dc-footer {
    position: absolute;
    bottom: 2rem;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.4);
    opacity: 0;
    animation: fadeIn 1s 5s forwards;
  }
  .dynamic-stage .dc-close {
    position: absolute;
    top: 1.5rem; right: 1.5rem;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--ink);
    font-size: 1.4rem;
    cursor: pointer;
    z-index: 5;
  }
  .char-anim {
    display: inline-block;
    opacity: 0;
    transform: translateY(8px);
    animation: charIn 0.4s forwards;
  }
  @keyframes charIn { to { opacity: 1; transform: none; } }

  .wall-entry {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.6rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .wall-entry:hover { border-color: var(--primary); transform: translateX(2px); }
  .wall-entry .we-text {
    font-size: 0.95rem;
    color: var(--ink);
    line-height: 1.6;
    margin-bottom: 0.4rem;
  }
  .wall-entry .we-meta {
    font-size: 0.75rem;
    color: var(--soft);
    display: flex;
    justify-content: space-between;
  }
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.85);
    color: var(--ink);
    padding: 0.7rem 1.4rem;
    border-radius: 30px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 200;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .footer {
    margin-top: 2.5rem;
    font-size: 0.82rem;
    color: rgba(255, 255, 255, 0.42);
    text-align: center;
    letter-spacing: 0.1em;
  }
  .footer .heart { color: var(--accent); }

  ::selection { background: var(--primary); color: var(--bg-grad-end); }
</style>
</head>
<body>
<canvas id="fireworks"></canvas>
<canvas id="petals"></canvas>
<main class="scene">
  <header class="title-wrap">
    <div class="label">致 · 恩 师</div>
    <h1 class="title">教师节快乐</h1>
    <p class="subtitle">桃李不言 · 下自成蹊</p>
  </header>

  <article class="card">
    <div class="card-title">心 里 的 话</div>
    <p class="quote" id="quoteText">三尺讲台，一生情怀。您用粉笔书写春秋，用岁月培育栋梁。</p>
    <p class="author" id="quoteAuthor">— 敬献</p>
    <div class="dots" id="dots"></div>
  </article>

  <nav class="actions">
    <button id="cardBtn">送上贺卡</button>
    <button class="ghost" id="customBtn">写一句心里话</button>
    <button class="ghost" id="nextBtn">换一句</button>
  </nav>

  <section class="panel" id="customPanel">
    <h3>写 一 句 心 里 话</h3>
    <div class="field">
      <label>对老师说</label>
      <textarea id="customText" placeholder="例如：谢谢您那年把我的作文当范文读，那是我后来敢写下去的全部理由。" maxlength="120"></textarea>
    </div>
    <div class="field">
      <label>落款（可留空）</label>
      <input id="customAuthor" type="text" placeholder="您的名字 / 班级" maxlength="30">
    </div>
    <div class="panel-actions">
      <button id="addQuoteBtn">加入轮播</button>
      <button class="ghost" id="useInCardBtn">用这句做贺卡</button>
    </div>
  </section>

  <div class="modal" id="cardModal">
    <div class="modal-inner">
      <button class="close-x" id="closeModal" aria-label="关闭">×</button>
      <div class="pattern-picker" id="patternPicker"></div>
      <canvas id="cardCanvas" width="1080" height="1440"></canvas>
      <div class="modal-actions">
        <button id="downloadBtn">保存图片</button>
        <button id="shareBtn">复制动态链接</button>
        <button class="ghost" id="recardBtn">换款式</button>
      </div>
    </div>
  </div>

  <div class="dynamic-stage" id="dynamicStage">
    <button class="dc-close" id="dcClose">×</button>
    <div class="dc-label">致 · 恩 师</div>
    <h1 class="dc-title">教师节快乐</h1>
    <p class="dc-subtitle">桃李不言 · 下自成蹊</p>
    <div class="dc-divider"></div>
    <p class="dc-quote" id="dcQuote"></p>
    <p class="dc-author" id="dcAuthor"></p>
    <div class="dc-footer">把这份心意 · 转发给那位让你想念的人 ♡</div>
  </div>

  <div class="modal" id="wallModal">
    <div class="modal-inner" style="max-width: 560px;">
      <button class="close-x" id="closeWall" aria-label="关闭">×</button>
      <div style="text-align:center; margin-bottom: 1rem;">
        <div class="card-title" style="margin-bottom: 0.4rem;">祝 福 墙</div>
        <div style="font-size: 0.78rem; color: var(--soft);">点击任意一条 · 重看那张贺卡</div>
      </div>
      <div id="wallList" style="max-height: 60vh; overflow-y: auto; padding: 0 0.3rem;"></div>
    </div>
  </div>

  <footer class="footer">把这份心意 · 转发给那位让你想念的人 <span class="heart">♡</span> · <a href="#" id="openWall" style="color: var(--primary); text-decoration: none;">祝福墙</a></footer>
</main>

<div class="toast" id="toast"></div>

<script>
const quotes = [
  { text: "三尺讲台，一生情怀。您用粉笔书写春秋，用岁月培育栋梁。", author: "— 敬献" },
  { text: "一支粉笔，两袖清风，三尺讲台，四季耕耘，您是黑夜里的那盏灯。", author: "— 学子 敬上" },
  { text: "师者，所以传道授业解惑也。一日为师，终生为念。", author: "— 韩愈《师说》化用" },
  { text: "您种下的不是花，是星辰大海。每个学生的远方，都站着您的守望。", author: "— 致引路人" },
  { text: "春蚕到死丝方尽，蜡炬成灰泪始干。师恩如海，浩瀚无言。", author: "— 李商隐《无题》" },
  { text: "桃李满天下，何用更堂前种花。您的名字写在风中，写在所有长大的孩子身上。", author: "— 白居易意" },
  { text: "黑板擦掉了字迹，擦不掉您留下的光。那些被您点过头的孩子，后来都成了星星。", author: "— 学子 敬上" },
  { text: "您没有教我如何成功，您只是教我如何成为一个完整的人。这比所有第一名都重要。", author: "— 远方来信" },
];

let idx = 0;
const quoteText = document.querySelector("#quoteText");
const quoteAuthor = document.querySelector("#quoteAuthor");
const dotsWrap = document.querySelector("#dots");

const renderDots = () => {
  dotsWrap.innerHTML = "";
  quotes.forEach((_, i) => {
    const d = document.createElement("span");
    d.className = "dot" + (i === idx ? " active" : "");
    d.addEventListener("click", () => showQuote(i));
    dotsWrap.appendChild(d);
  });
};

const showQuote = (i) => {
  if (i === idx) return;
  idx = i;
  quoteText.style.opacity = 0;
  quoteAuthor.style.opacity = 0;
  setTimeout(() => {
    quoteText.textContent = quotes[i].text;
    quoteAuthor.textContent = quotes[i].author;
    quoteText.style.opacity = 1;
    quoteAuthor.style.opacity = 1;
  }, 300);
  renderDots();
};
renderDots();

document.querySelector("#nextBtn").addEventListener("click", () => {
  showQuote((idx + 1) % quotes.length);
});

let autoTimer = setInterval(() => showQuote((idx + 1) % quotes.length), 6500);

const customPanel = document.querySelector("#customPanel");
const customText = document.querySelector("#customText");
const customAuthor = document.querySelector("#customAuthor");

document.querySelector("#customBtn").addEventListener("click", () => {
  customPanel.classList.toggle("show");
  if (customPanel.classList.contains("show")) customText.focus();
});

document.querySelector("#addQuoteBtn").addEventListener("click", () => {
  const t = customText.value.trim();
  if (!t) return;
  quotes.push({ text: t, author: customAuthor.value.trim() ? "— " + customAuthor.value.trim() : "— 您的学生" });
  showQuote(quotes.length - 1);
  customText.value = "";
  customAuthor.value = "";
  customPanel.classList.remove("show");
});

document.querySelector("#useInCardBtn").addEventListener("click", () => {
  openCardModal(customText.value.trim(), customAuthor.value.trim());
});

const petalsCanvas = document.querySelector("#petals");
const pctx = petalsCanvas.getContext("2d");
const fireworksCanvas = document.querySelector("#fireworks");
const fctx = fireworksCanvas.getContext("2d");

const resize = () => {
  [petalsCanvas, fireworksCanvas].forEach(c => {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  });
};
window.addEventListener("resize", resize);
resize();

const PETAL_COLORS = ["#ffb7c5", "#ff8fa3", "#ffd4a3", "#e8b86a", "#ffe4a0"];
const petals = [];

const makePetal = (x) => ({
  x: x ?? Math.random() * petalsCanvas.width,
  y: -20,
  size: 6 + Math.random() * 8,
  speed: 0.6 + Math.random() * 1.4,
  drift: (Math.random() - 0.5) * 1.6,
  swing: Math.random() * Math.PI * 2,
  swingSpeed: 0.02 + Math.random() * 0.03,
  rot: Math.random() * Math.PI * 2,
  rotSpeed: (Math.random() - 0.5) * 0.04,
  color: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)],
  alpha: 0.7 + Math.random() * 0.3,
});

for (let i = 0; i < 60; i++) petals.push(makePetal(Math.random() * petalsCanvas.width));

const drawPetal = (p) => {
  pctx.save();
  pctx.translate(p.x, p.y);
  pctx.rotate(p.rot);
  pctx.globalAlpha = p.alpha;
  pctx.fillStyle = p.color;
  pctx.beginPath();
  pctx.moveTo(0, -p.size);
  pctx.bezierCurveTo(p.size * 0.6, -p.size * 0.8, p.size * 0.5, p.size * 0.4, 0, p.size);
  pctx.bezierCurveTo(-p.size * 0.5, p.size * 0.4, -p.size * 0.6, -p.size * 0.8, 0, -p.size);
  pctx.fill();
  pctx.restore();
};

const fireworks = [];
const particles = [];
const sparks = [];
const FW_COLORS = ["#ff6b9d", "#e8b86a", "#ffe4a0", "#ff8fa3", "#7ed7c1", "#a18cd1", "#f9a826", "#ffd1dc"];

const launchFirework = (x, y) => {
  const targetY = y ?? (fireworksCanvas.height * (0.16 + Math.random() * 0.28));
  const startX = x ?? (fireworksCanvas.width * (0.15 + Math.random() * 0.7));
  fireworks.push({
    x: startX,
    y: fireworksCanvas.height,
    vy: -(fireworksCanvas.height - targetY) * 0.013 - 7.5,
    targetY: targetY,
    color: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)],
    trail: [],
    sparkTimer: 0,
  });
};

const explode = (fw) => {
  const count = 80 + Math.floor(Math.random() * 50);
  const baseAngle = Math.random() * Math.PI * 2;
  for (let i = 0; i < count; i++) {
    const angle = baseAngle + (i / count) * Math.PI * 2;
    const speed = 2 + Math.sin(i / count * Math.PI) * 2.5 + Math.random() * 2.5;
    particles.push({
      x: fw.x,
      y: fw.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.008 + Math.random() * 0.012,
      color: fw.color,
      size: 1.6 + Math.random() * 2.2,
      gravity: 0.045 + Math.random() * 0.02,
      drag: 0.985 + Math.random() * 0.01,
      trail: [],
      canSecond: Math.random() < 0.18,
    });
  }
  sparks.push({ x: fw.x, y: fw.y, life: 1, decay: 0.05, size: 18, color: "#ffffff" });
};

const secondBurst = (p) => {
  const count = 12 + Math.floor(Math.random() * 8);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 2;
    particles.push({
      x: p.x,
      y: p.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.7,
      decay: 0.02 + Math.random() * 0.02,
      color: p.color,
      size: 1.2 + Math.random() * 1.4,
      gravity: 0.04,
      drag: 0.985,
      trail: [],
      canSecond: false,
    });
  }
};

const MAX_PARTICLES = 350;
const animate = () => {
  fctx.fillStyle = "rgba(15, 10, 31, 0.16)";
  fctx.fillRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

  fctx.lineCap = "round";
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const fw = fireworks[i];
    fw.trail.push({ x: fw.x, y: fw.y });
    if (fw.trail.length > 14) fw.trail.shift();
    fw.y += fw.vy;
    fw.vy += 0.06;

    if (fw.trail.length > 1) {
      fctx.beginPath();
      fctx.moveTo(fw.trail[0].x, fw.trail[0].y);
      for (let j = 1; j < fw.trail.length; j++) {
        fctx.lineTo(fw.trail[j].x, fw.trail[j].y);
      }
      fctx.strokeStyle = fw.color;
      fctx.globalAlpha = 0.6;
      fctx.lineWidth = 2.5;
      fctx.stroke();
    }
    fctx.globalAlpha = 1;
    fctx.fillStyle = "#ffffff";
    fctx.beginPath();
    fctx.arc(fw.x, fw.y, 2.5, 0, Math.PI * 2);
    fctx.fill();
    fctx.fillStyle = fw.color;
    fctx.globalAlpha = 0.4;
    fctx.beginPath();
    fctx.arc(fw.x, fw.y, 5, 0, Math.PI * 2);
    fctx.fill();
    fctx.globalAlpha = 1;

    fw.sparkTimer++;
    if (fw.sparkTimer % 3 === 0 && sparks.length < 80) {
      sparks.push({
        x: fw.x + (Math.random() - 0.5) * 4,
        y: fw.y + 6,
        vx: (Math.random() - 0.5) * 1.2,
        vy: 0.5 + Math.random() * 1.2,
        life: 1,
        decay: 0.045 + Math.random() * 0.03,
        size: 1 + Math.random() * 1.4,
        color: fw.color,
      });
    }

    if (fw.y <= fw.targetY || fw.vy >= 0) {
      explode(fw);
      fireworks.splice(i, 1);
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x = s.x + (s.vx || 0);
    s.y = s.y + (s.vy || 0);
    s.life -= s.decay;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    fctx.globalAlpha = s.life * 0.5;
    fctx.fillStyle = s.color;
    fctx.beginPath();
    fctx.arc(s.x, s.y, s.size * s.life * 2.5, 0, Math.PI * 2);
    fctx.fill();
    fctx.globalAlpha = s.life;
    fctx.fillStyle = "#fff";
    fctx.beginPath();
    fctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
    fctx.fill();
  }
  fctx.globalAlpha = 1;

  if (particles.length > MAX_PARTICLES) {
    particles.sort((a, b) => b.life - a.life);
    particles.length = MAX_PARTICLES;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 5) p.trail.shift();
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= p.drag;
    p.life -= p.decay;

    if (p.life <= 0) { particles.splice(i, 1); continue; }

    if (p.trail.length > 1) {
      fctx.beginPath();
      fctx.moveTo(p.trail[0].x, p.trail[0].y);
      for (let j = 1; j < p.trail.length; j++) {
        fctx.lineTo(p.trail[j].x, p.trail[j].y);
      }
      fctx.strokeStyle = p.color;
      fctx.globalAlpha = p.life * 0.4;
      fctx.lineWidth = p.size * 0.8;
      fctx.stroke();
    }

    fctx.globalAlpha = p.life * 0.35;
    fctx.fillStyle = p.color;
    fctx.beginPath();
    fctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
    fctx.fill();
    fctx.globalAlpha = p.life;
    fctx.fillStyle = "#fff";
    fctx.beginPath();
    fctx.arc(p.x, p.y, p.size * (0.6 + p.life * 0.4), 0, Math.PI * 2);
    fctx.fill();

    if (p.canSecond && p.life < 0.45) {
      secondBurst(p);
      p.canSecond = false;
    }
  }
  fctx.globalAlpha = 1;

  pctx.clearRect(0, 0, petalsCanvas.width, petalsCanvas.height);
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i];
    p.swing += p.swingSpeed;
    p.x += p.drift + Math.sin(p.swing) * 0.6;
    p.y += p.speed;
    p.rot += p.rotSpeed;
    drawPetal(p);
    if (p.y > petalsCanvas.height + 20) {
      petals[i] = makePetal();
    }
  }

  requestAnimationFrame(animate);
};
animate();

setTimeout(() => {
  for (let i = 0; i < 4; i++) setTimeout(() => launchFirework(), i * 700);
}, 800);

document.addEventListener("click", (e) => {
  if (e.target.closest("button")) return;
  if (e.target.closest(".panel")) return;
  if (e.target.closest(".modal")) return;
  launchFirework(e.clientX);
});

document.addEventListener("touchstart", (e) => {
  if (e.target.closest("button")) return;
  if (e.target.closest(".panel")) return;
  if (e.target.closest(".modal")) return;
  const t = e.touches[0];
  launchFirework(t.clientX);
}, { passive: true });

const cardModal = document.querySelector("#cardModal");
const cardCanvas = document.querySelector("#cardCanvas");
const cctx = cardCanvas.getContext("2d");

const PATTERNS = [
  { name: "紫夜", bg1: "#3a1f5d", bg2: "#1a0d2e", accent: "#e8b86a", ink: "#fef6e4", petal: "#ff8fa3" },
  { name: "酒红", bg1: "#5d1f3a", bg2: "#2e0d1a", accent: "#ffd4a3", ink: "#fff0e6", petal: "#ffb7c5" },
  { name: "海蓝", bg1: "#1f3a5d", bg2: "#0d1a2e", accent: "#ffe4a0", ink: "#e6f0ff", petal: "#a18cd1" },
  { name: "暖棕", bg1: "#5d3a1f", bg2: "#2e1a0d", accent: "#ffd4a3", ink: "#fff0e6", petal: "#ff8fa3" },
  { name: "墨绿", bg1: "#1f3a2e", bg2: "#0d1a14", accent: "#e8d86a", ink: "#f4f6e4", petal: "#ffb7c5" },
  { name: "靛紫", bg1: "#2a1f5d", bg2: "#0d0a2e", accent: "#ffd4a3", ink: "#e6e8ff", petal: "#ff8fa3" },
];
let currentPattern = 0;

const wrapText = (ctx, text, x, y, maxWidth, lineHeight, maxLines = 99) => {
  const chars = text.split("");
  let line = "";
  let lines = [];
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line.length > 0) {
      lines.push(line);
      line = ch;
      if (lines.length >= maxLines - 1) break;
    } else {
      line = test;
    }
  }
  if (lines.length < maxLines) lines.push(line);
  lines = lines.slice(0, maxLines);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
  return lines.length * lineHeight;
};

const drawPetalOnCard = (ctx, x, y, size, color, rot) => {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.bezierCurveTo(size * 0.6, -size * 0.8, size * 0.5, size * 0.4, 0, size);
  ctx.bezierCurveTo(-size * 0.5, size * 0.4, -size * 0.6, -size * 0.8, 0, -size);
  ctx.fill();
  ctx.restore();
};

const generateCard = (customText, customAuthor) => {
  const W = cardCanvas.width;
  const H = cardCanvas.height;
  const pat = PATTERNS[currentPattern];

  const grad = cctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, pat.bg1);
  grad.addColorStop(1, pat.bg2);
  cctx.fillStyle = grad;
  cctx.fillRect(0, 0, W, H);

  const halo = cctx.createRadialGradient(W / 2, H * 0.32, 30, W / 2, H * 0.32, W * 0.55);
  halo.addColorStop(0, "rgba(255,228,160,0.22)");
  halo.addColorStop(1, "rgba(255,228,160,0)");
  cctx.fillStyle = halo;
  cctx.fillRect(0, 0, W, H);

  cctx.strokeStyle = pat.accent;
  cctx.lineWidth = 4;
  cctx.strokeRect(40, 40, W - 80, H - 80);
  cctx.lineWidth = 1;
  cctx.strokeRect(56, 56, W - 112, H - 112);

  for (let i = 0; i < 28; i++) {
    const px = 80 + Math.random() * (W - 160);
    const py = 80 + Math.random() * (H - 160);
    const ps = 10 + Math.random() * 16;
    drawPetalOnCard(cctx, px, py, ps, pat.petal, Math.random() * Math.PI * 2);
  }

  cctx.fillStyle = pat.accent;
  cctx.font = "600 38px 'Songti SC', 'STSong', 'Noto Serif SC', serif";
  cctx.textAlign = "center";
  cctx.letterSpacing = "8px";
  cctx.fillText("致 · 恩 师", W / 2, 180);

  const titleGrad = cctx.createLinearGradient(0, 220, 0, 360);
  titleGrad.addColorStop(0, "#ffe4a0");
  titleGrad.addColorStop(0.5, pat.accent);
  titleGrad.addColorStop(1, pat.petal);
  cctx.fillStyle = titleGrad;
  cctx.font = "700 120px 'Songti SC', 'STSong', serif";
  cctx.fillText("教师节快乐", W / 2, 330);

  cctx.fillStyle = pat.ink;
  cctx.globalAlpha = 0.75;
  cctx.font = "400 32px 'Songti SC', serif";
  cctx.fillText("桃李不言 · 下自成蹊", W / 2, 400);
  cctx.globalAlpha = 1;

  cctx.strokeStyle = pat.accent;
  cctx.lineWidth = 1.5;
  cctx.beginPath();
  cctx.moveTo(W * 0.3, 450);
  cctx.lineTo(W * 0.7, 450);
  cctx.stroke();

  const text = customText || quotes[idx].text;
  cctx.fillStyle = pat.ink;
  cctx.textAlign = "left";
  cctx.font = "400 40px 'Songti SC', serif";
  const startX = 140;
  const maxWidth = W - 280;
  const used = wrapText(cctx, text, startX, 540, maxWidth, 64, 5);

  const authorText = customAuthor
    ? "— " + customAuthor
    : (quotes[idx].author || "— 您的学生 敬上");
  cctx.fillStyle = pat.accent;
  cctx.font = "300 32px 'Songti SC', serif";
  cctx.textAlign = "right";
  cctx.fillText(authorText, W - 140, 540 + used + 50);

  cctx.fillStyle = pat.ink;
  cctx.globalAlpha = 0.5;
  cctx.font = "300 26px 'Songti SC', serif";
  cctx.textAlign = "center";
  const dateStr = `二〇二六年九月十日 · 教师节`;
  cctx.fillText(dateStr, W / 2, H - 110);
  cctx.globalAlpha = 1;

  cctx.fillStyle = pat.accent;
  cctx.font = "400 28px serif";
  cctx.fillText("♡ ✿ ♡", W / 2, H - 70);
};

const openCardModal = (customText, customAuthor) => {
  pendingText = customText;
  pendingAuthor = customAuthor;
  renderPatternPicker();
  generateCard(pendingText, pendingAuthor);
  cardModal.classList.add("show");
};

let pendingText = null;
let pendingAuthor = null;

const renderPatternPicker = () => {
  const wrap = document.querySelector("#patternPicker");
  wrap.innerHTML = "";
  PATTERNS.forEach((p, i) => {
    const chip = document.createElement("div");
    chip.className = "pattern-chip" + (i === currentPattern ? " active" : "");
    chip.style.background = `linear-gradient(135deg, ${p.bg1}, ${p.bg2})`;
    chip.title = p.name;
    chip.addEventListener("click", () => {
      currentPattern = i;
      renderPatternPicker();
      generateCard(pendingText, pendingAuthor);
    });
    wrap.appendChild(chip);
  });
};

document.querySelector("#cardBtn").addEventListener("click", () => openCardModal());
document.querySelector("#recardBtn").addEventListener("click", () => {
  currentPattern = (currentPattern + 1 + Math.floor(Math.random() * (PATTERNS.length - 1))) % PATTERNS.length;
  renderPatternPicker();
  generateCard(pendingText, pendingAuthor);
});
document.querySelector("#closeModal").addEventListener("click", () => cardModal.classList.remove("show"));
cardModal.addEventListener("click", (e) => {
  if (e.target === cardModal) cardModal.classList.remove("show");
});

document.querySelector("#downloadBtn").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "教师节贺卡.png";
  link.href = cardCanvas.toDataURL("image/png");
  link.click();
});

const dynamicStage = document.querySelector("#dynamicStage");
const dcQuote = document.querySelector("#dcQuote");
const dcAuthor = document.querySelector("#dcAuthor");
const toast = document.querySelector("#toast");

const showToast = (msg) => {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
};

const b64encode = (str) => {
  try {
    return btoa(unescape(encodeURIComponent(str)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  } catch { return ""; }
};
const b64decode = (str) => {
  try {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    return decodeURIComponent(escape(atob(str)));
  } catch { return ""; }
};

const WALL_KEY = "teacher_day_wall_v1";

const loadWall = () => {
  try { return JSON.parse(localStorage.getItem(WALL_KEY) || "[]"); }
  catch { return []; }
};
const saveWall = (arr) => localStorage.setItem(WALL_KEY, JSON.stringify(arr));

const addToWall = (text, author, pattern) => {
  const wall = loadWall();
  if (wall.some(e => e.text === text && e.author === author)) return;
  wall.push({
    text, author,
    pattern: pattern ?? currentPattern,
    time: Date.now(),
  });
  if (wall.length > 50) wall.splice(0, wall.length - 50);
  saveWall(wall);
};

const renderCharByChar = (el, text, startDelay = 0) => {
  el.innerHTML = "";
  const chars = text.split("");
  chars.forEach((ch, i) => {
    const span = document.createElement("span");
    span.className = "char-anim";
    span.textContent = ch === " " ? "\u00A0" : ch;
    span.style.animationDelay = `${startDelay + i * 0.06}s`;
    el.appendChild(span);
  });
};

const playDynamic = (text, author, pattern) => {
  if (pattern != null && PATTERNS[pattern]) {
    currentPattern = pattern;
    renderPatternPicker();
  }
  dcQuote.style.animation = "none";
  dcAuthor.style.animation = "none";
  void dcQuote.offsetWidth;
  dcQuote.style.animation = "";
  dcAuthor.style.animation = "";
  renderCharByChar(dcQuote, text, 2.0);
  dcAuthor.textContent = author || "— 敬献";
  dynamicStage.classList.add("show");
  generateCard(text, author);
  setTimeout(() => launchFirework(), 400);
  setTimeout(() => launchFirework(), 1200);
  setTimeout(() => launchFirework(), 2000);
};

document.querySelector("#dcClose").addEventListener("click", () => {
  dynamicStage.classList.remove("show");
});
document.querySelector("#shareBtn").addEventListener("click", () => {
  const text = pendingText || quotes[idx].text;
  const author = pendingAuthor
    ? "— " + pendingAuthor
    : (quotes[idx].author || "— 敬献");
  const hash = `#b=${b64encode(text)}&a=${b64encode(author)}&p=${currentPattern}`;
  const url = location.origin + location.pathname + hash;
  navigator.clipboard.writeText(url).then(() => {
    showToast("已复制 · 把链接发给朋友即可");
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast("已复制 · 把链接发给朋友即可"); }
    catch { showToast("复制失败 · 请手动复制：" + url); }
    document.body.removeChild(ta);
  });
});

const checkSharedUrl = () => {
  const hash = location.hash.slice(1);
  if (!hash) return;
  const params = new URLSearchParams(hash);
  const b = params.get("b");
  const a = params.get("a");
  const p = params.get("p");
  if (!b) return;
  const text = b64decode(b);
  const author = b64decode(a) || "— 敬献";
  const pattern = p ? parseInt(p, 10) : 0;
  if (!text) return;
  addToWall(text, author, pattern);
  setTimeout(() => playDynamic(text, author, pattern), 1200);
};
checkSharedUrl();

const wallModal = document.querySelector("#wallModal");
const wallList = document.querySelector("#wallList");

const renderWall = () => {
  const wall = loadWall();
  wallList.innerHTML = "";
  if (wall.length === 0) {
    wallList.innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--soft); font-size: 0.9rem;">还没有人给你写过祝福<br><br>把动态链接发给朋友 · 他们写完发回来 · 就会出现在这里</div>`;
    return;
  }
  wall.slice().reverse().forEach((e) => {
    const item = document.createElement("div");
    item.className = "wall-entry";
    const date = new Date(e.time);
    const timeStr = `${date.getMonth() + 1}月${date.getDate()}日 ${String(date.getHours()).padStart(2,"0")}:${String(date.getMinutes()).padStart(2,"0")}`;
    item.innerHTML = `
      <div class="we-text">${e.text.replace(/</g, "&lt;")}</div>
      <div class="we-meta"><span>${e.author || "— 敬献"}</span><span>${timeStr}</span></div>
    `;
    item.addEventListener("click", () => {
      wallModal.classList.remove("show");
      playDynamic(e.text, e.author, e.pattern);
    });
    wallList.appendChild(item);
  });
};

document.querySelector("#openWall").addEventListener("click", (e) => {
  e.preventDefault();
  renderWall();
  wallModal.classList.add("show");
});
document.querySelector("#closeWall").addEventListener("click", () => wallModal.classList.remove("show"));
wallModal.addEventListener("click", (e) => {
  if (e.target === wallModal) wallModal.classList.remove("show");
});
</script>
